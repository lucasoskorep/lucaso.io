[tools]
node = "latest"
npm = "latest"

# --- Site building -----------------------------------------------------------

[tasks.setup]
description = "Install dependencies"
run = "npm install"

[tasks.build]
alias = "html"
description = "Generate the static site into output/"
run = "npm run build"

[tasks.publish]
description = "Generate production build into output/"
run = "npm run build"

[tasks.clean]
description = "Remove the generated output directory"
run = "rm -rf output"

# --- Local dev server --------------------------------------------------------

[tasks.dev]
alias = ["serve", "devserver"]
description = "Run Astro dev server (mise run dev)"
run = "npm run dev"

[tasks.preview]
description = "Preview built site in output/"
run = "npm run preview"

# --- Utilities ---------------------------------------------------------------

[tasks.update-projects]
description = "Inject project READMEs into src/content/projects"
run = "node scripts/update-projects.mjs"

# --- Containers (podman) -------------------------------------------------------

[tasks."container:build"]
description = "Build the multi-arch image as a podman manifest"
run = "podman build --target release --platform linux/arm64,linux/amd64 --manifest chaos2theory/personal-site:latest ."

[tasks."container:push"]
description = "Push the manifest to Gitea and Harbor, then remove it locally"
run = """
podman manifest push --all chaos2theory/personal-site:latest gitea.chaosdev.gay/lucasoskorep/personal-site:latest
podman manifest push --all chaos2theory/personal-site:latest harbor.chaosdev.gay/website/personal-site:latest
podman manifest rm chaos2theory/personal-site:latest
"""

[tasks."container:run"]
description = "Build the image for the local arch and run it on port 8000"
run = """
podman build --target release --tag chaos2theory/personal-site:latest . --load
podman run --rm -p 8000:80 localhost/chaos2theory/personal-site:latest
podman image rm localhost/chaos2theory/personal-site:latest
"""
