<!-- Desktop Icons (Ordered: About Me -> Projects -> Blog -> 3D Prints -> Links) -->
<div class="desktop" id="desk">
    <div class="d-icon" data-open="about">
        <div class="glyph">
            <svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="17" fill="#c0c0c0" stroke="#000" stroke-width="1.5"/><rect x="6" y="6" width="20" height="13" fill="#183661"/><circle cx="16" cy="11" r="3" fill="#ffff55"/><path d="M10 18c1-3 11-3 12 0" fill="#33ff78"/><rect x="6" y="23" width="20" height="5" fill="#c0c0c0" stroke="#000" stroke-width="1.5"/></svg>
        </div>
        <span>About Me</span>
    </div>

    <div class="d-icon" data-open="projects">
        <div class="glyph">
            <svg viewBox="0 0 32 32"><path d="M3 8h10l2 3h14v16H3Z" fill="#ffff55" stroke="#000" stroke-width="1.5"/><path d="M3 12h26v15H3Z" fill="#ffcc00" stroke="#000" stroke-width="1.5"/></svg>
        </div>
        <span>Projects</span>
    </div>

    <div class="d-icon" data-open="blog">
        <div class="glyph">
            <svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="26" fill="#e6edf7" stroke="#000" stroke-width="1.5"/><rect x="6" y="3" width="20" height="5" fill="#183661"/><line x1="9" y1="12" x2="23" y2="12" stroke="#000" stroke-width="1.5"/><line x1="9" y1="16" x2="23" y2="16" stroke="#000" stroke-width="1.5"/><line x1="9" y1="20" x2="18" y2="20" stroke="#000" stroke-width="1.5"/></svg>
        </div>
        <span>Blog</span>
    </div>

    <div class="d-icon" data-open="models">
        <div class="glyph">
            <svg viewBox="0 0 32 32"><polygon points="16,3 28,9 28,23 16,29 4,23 4,9" fill="#55ffff" stroke="#000" stroke-width="1.5"/><polyline points="4,9 16,15 28,9" fill="none" stroke="#000" stroke-width="1.5"/><line x1="16" y1="15" x2="16" y2="29" stroke="#000" stroke-width="1.5"/></svg>
        </div>
        <span>3D Prints</span>
    </div>

    <div class="d-icon" data-open="term">
        <div class="glyph">
            <svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" fill="#000" stroke="#000" stroke-width="1.5"/><rect x="3" y="5" width="26" height="5" fill="#183661"/><text x="6" y="20" fill="#33ff78" font-family="monospace" font-weight="bold" font-size="9">$ _</text></svg>
        </div>
        <span>Links</span>
    </div>

    {% if SHOW_RESUME %}
    <div class="d-icon" data-open="resume">
        <div class="glyph">
            <svg viewBox="0 0 32 32"><rect x="6" y="3" width="20" height="26" fill="#ffffcc" stroke="#000" stroke-width="1.5"/><line x1="10" y1="9" x2="22" y2="9" stroke="#183661" stroke-width="2"/><line x1="10" y1="14" x2="22" y2="14" stroke="#000" stroke-width="1.5"/><line x1="10" y1="19" x2="22" y2="19" stroke="#000" stroke-width="1.5"/></svg>
        </div>
        <span>resume.sh</span>
    </div>
    {% endif %}
</div>
